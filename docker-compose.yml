services:
  openfresh:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4269:4269"
    environment:
      OPENFRESH_DB: /data/openfresh.db
      OPENFRESH_LLM_URL: http://llm:11434/v1
      OPENFRESH_LLM_MODEL: gemma3n:e4b
      OPENFRESH_LLM_TIMEOUT: 300
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4269/settings')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  llm:
    image: ollama/ollama:latest
    container_name: openfresh-llm
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull gemma3n:e4b && wait"]
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped
