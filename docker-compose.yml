services:
  openfresh:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENFRESH_DB: /data/openfresh.db
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/settings')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
